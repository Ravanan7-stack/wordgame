<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Finder</title>
<style>
:root{--bg:#080711;--panel:#12112a;--line:rgba(255,255,255,.1);--text:#f7f5ff;--muted:#a6a2bc;--p:#a044ff;--b:#687bff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(circle at 70% 0,#3a1a6e 0,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px}
h1{font-size:1.8rem;font-style:italic;margin:8px 0 12px}
h1 span{background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.lv{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.lv b{font-size:1.2rem;min-width:100px;text-align:center}
.lv button{width:40px;height:40px;padding:0;font-size:1rem}
.lv button:disabled{opacity:.3;cursor:default}
.bar{display:flex;gap:14px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:.9rem;flex-wrap:wrap;justify-content:center}
.bar b{color:var(--text)}
button{border:0;border-radius:30px;padding:10px 22px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--p),var(--b));cursor:pointer}
#grid{--n:6;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;width:min(92vw,440px);padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 0 40px #7c4dff33;user-select:none}
.c{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-weight:700;font-size:calc(min(92vw,440px)/var(--n)*.42);background:#1a1838;cursor:pointer;transition:.15s}
.c.sel{background:var(--b);transform:scale(1.1)}
.c.found{background:linear-gradient(135deg,var(--p),var(--b))}
#words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:440px}
.w{padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:.85rem;letter-spacing:.08em}
.w.done{text-decoration:line-through;color:var(--muted);border-color:var(--p)}
#msg{margin-top:16px;min-height:28px;font-weight:700;color:#7dffb0;text-align:center}
#next{display:none;margin-top:10px}
</style>
</head>
<body>
<h1>Word <span>Finder</span></h1>
<div class="lv"><button id="prev" aria-label="Previous level">◀</button><b id="lvl">Level 1</b><button id="nx" aria-label="Next level">▶</button></div>
<div class="bar">Found: <b id="cnt">0</b>/<b id="tot">0</b> · Time: <b id="time">0</b>s <button id="again">Restart</button></div>
<div id="grid"></div>
<div id="words"></div>
<div id="msg"></div>
<button id="next">Next level ▶</button>

<script>
const MAX=30;
const POOL=("STEAM DISCORD GAMER LEVEL PIXEL QUEST BOSS CODE RESPAWN LOOT NOOB CLAN SQUAD SKIN RANK "+
"CONSOLE JOYSTICK KEYBOARD MOUSE MONITOR HEADSET STREAM STREAMER SERVER LAG PING FPS CHEAT BUFF NERF "+
"SPAWN ARENA GUILD DUNGEON DRAGON KNIGHT WIZARD SWORD SHIELD ARMOR POTION TREASURE CHEST MAP RACE "+
"DRIFT TURBO ENGINE GARAGE SPEED NITRO CRASH LAPTOP ROUTER CIRCUIT CHIP MEMORY STORAGE SYSTEM WINDOWS "+
"LINUX PYTHON SCRIPT BROWSER WEBSITE DOMAIN HOSTING DESIGN LAYOUT BUTTON FOLDER FILE CLOUD ROBOT DRONE "+
"SPACE ROCKET GALAXY PLANET ORBIT LASER ALIEN PHONE TABLET CAMERA SELFIE VIDEO AUDIO MUSIC BEAT").split(" ");
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let level=1,unlocked=1,grid,words,found,start,t0,timer,size;

try{unlocked=Math.min(MAX,parseInt(localStorage.getItem("wf_unlocked"))||1)}catch(e){}

function cfg(l){
  const n=Math.min(6+Math.floor((l-1)/3),12);
  const count=Math.min(4+Math.floor((l-1)/2),12);
  const dirs=[[0,1],[1,0]];
  if(l>=4)dirs.push([1,1],[1,-1]);
  if(l>=8)dirs.push([0,-1],[-1,0],[-1,-1],[-1,1]);
  return {n,count,dirs};
}

function build(){
  const {n,count,dirs}=cfg(level);size=n;
  const pool=POOL.filter(w=>w.length<=n).sort(()=>Math.random()-.5).slice(0,count);
  grid=Array.from({length:n},()=>Array(n).fill(""));
  words=[];
  pool.forEach(w=>{
    for(let t=0;t<300;t++){
      const [dr,dc]=dirs[rnd(dirs.length)];
      const r=rnd(n),c=rnd(n);
      const er=r+dr*(w.length-1),ec=c+dc*(w.length-1);
      if(er<0||er>=n||ec<0||ec>=n)continue;
      let ok=true;
      for(let i=0;i<w.length;i++){const v=grid[r+dr*i][c+dc*i];if(v&&v!==w[i]){ok=false;break}}
      if(!ok)continue;
      for(let i=0;i<w.length;i++)grid[r+dr*i][c+dc*i]=w[i];
      words.push(w);return;
    }
  });
  const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!grid[r][c])grid[r][c]=A[rnd(26)];
}

function render(){
  const g=$("grid");g.innerHTML="";g.style.setProperty("--n",size);
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    const d=document.createElement("div");
    d.className="c";d.textContent=grid[r][c];
    d.onclick=()=>pick(r,c);
    g.appendChild(d);
  }
  $("words").innerHTML=words.map(w=>`<span class="w" id="w-${w}">${w}</span>`).join("");
  $("tot").textContent=words.length;
}

const cell=(r,c)=>$("grid").children[r*size+c];

function pick(r,c){
  if(!start){start=[r,c];cell(r,c).classList.add("sel");return}
  const [r1,c1]=start;
  cell(r1,c1).classList.remove("sel");
  start=null;
  if(!(r===r1||c===c1||Math.abs(r-r1)===Math.abs(c-c1)))return;
  const dr=Math.sign(r-r1),dc=Math.sign(c-c1);
  const n=Math.max(Math.abs(r-r1),Math.abs(c-c1))+1;
  const cells=[];let s="";
  for(let i=0;i<n;i++){const rr=r1+dr*i,cc=c1+dc*i;cells.push([rr,cc]);s+=grid[rr][cc]}
  const rev=[...s].reverse().join("");
  const w=words.find(x=>!found.has(x)&&(x===s||x===rev));
  if(!w)return;
  found.add(w);
  cells.forEach(([rr,cc])=>cell(rr,cc).classList.add("found"));
  $("w-"+w).classList.add("done");
  $("cnt").textContent=found.size;
  if(found.size===words.length)win();
}

function win(){
  clearInterval(timer);
  if(level<MAX){
    if(level+1>unlocked){unlocked=level+1;try{localStorage.setItem("wf_unlocked",unlocked)}catch(e){}}
    $("msg").textContent="🎉 Level "+level+" done in "+$("time").textContent+"s!";
    $("next").style.display="inline-block";
  }else{
    $("msg").textContent="🏆 You finished all "+MAX+" levels!";
  }
  nav();
}

function nav(){
  $("lvl").textContent="Level "+level;
  $("prev").disabled=level<=1;
  $("nx").disabled=level>=unlocked;
}

function init(){
  clearInterval(timer);
  found=new Set();start=null;
  $("cnt").textContent=0;$("msg").textContent="";$("time").textContent=0;
  $("next").style.display="none";
  build();render();nav();
  t0=Date.now();
  timer=setInterval(()=>$("time").textContent=Math.floor((Date.now()-t0)/1000),500);
}
$("again").onclick=init;
$("next").onclick=()=>{level++;init()};
$("prev").onclick=()=>{if(level>1){level--;init()}};
$("nx").onclick=()=>{if(level<unlocked){level++;init()}};
level=unlocked;
init();
</script>
</body>
</html>
