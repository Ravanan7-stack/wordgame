<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WORD HUNT - Mobile Word Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e0b36 0%, #0d021a 70%, #05010a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Main App Container */
    .app-card {
      width: 100%;
      max-width: 440px;
      background: rgba(20, 8, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 20px 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.15);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    /* Header Logo */
    .logo-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffffff 0%, #38bdf8 40%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    /* Stat Cards Header */
    .stats-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .stat-pill {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .stat-title {
      font-size: 10px;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      color: #f4f4f5;
    }

    .instruction-text {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* Grid Frame */
    .grid-container {
      width: 100%;
      background: rgba(10, 4, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    .board-grid {
      display: grid;
      gap: 4px;
      width: 100%;
      aspect-ratio: 1;
    }

    .grid-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(13px + 0.5vw);
      font-weight: 800;
      color: #e4e4e7;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, transform 0.1s, box-shadow 0.15s;
    }

    .grid-cell.selected {
      background: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 12px #00d2ff, 0 0 24px rgba(0, 210, 255, 0.8);
      transform: scale(1.06);
      z-index: 3;
    }

    .grid-cell.found {
      background: rgba(34, 197, 94, 0.35);
      border: 1px solid #22c55e;
      color: #ffffff;
    }

    .grid-cell.hint-pulse {
      animation: hintGlow 1s infinite alternate ease-in-out;
      z-index: 4;
    }

    @keyframes hintGlow {
      0% {
        background: #f59e0b;
        box-shadow: 0 0 8px #f59e0b;
      }
      100% {
        background: #ef4444;
        box-shadow: 0 0 20px #ef4444;
        transform: scale(1.15);
      }
    }

    /* Target Words Chips */
    .word-chips-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      align-items: center;
    }

    .word-chip {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #cbd5e1;
      transition: all 0.3s ease;
    }

    .word-chip.found {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      text-decoration: line-through;
      opacity: 0.5;
    }

    /* Controls Bar */
    .bottom-controls {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Victory Overlay Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 3, 25, 0.92);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .win-title {
      font-size: 32px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 15px #38bdf8;
    }

    .win-sub {
      font-size: 14px;
      color: #cbd5e1;
    }

    .next-lvl-btn {
      padding: 14px 32px;
      background: linear-gradient(90deg, #0284c7 0%, #ec4899 100%);
      border: none;
      border-radius: 24px;
      color: white;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
      transition: transform 0.15s;
    }

    .next-lvl-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="logo-title">WORD HUNT</h1>

    <!-- Stats Dashboard Header -->
    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-title">Level</div>
        <div class="stat-num" id="level-num">1</div>
      </div>
      <div class="stat-pill">
        <div class="stat-title">Score</div>
        <div class="stat-num" id="score-num">0</div>
      </div>
      <div class="stat-pill">
        <div class="stat-title">Found</div>
        <div class="stat-num" id="found-num">0/4</div>
      </div>
    </div>

    <div class="instruction-text">Slide across letters to form words</div>

    <!-- Letter Matrix Grid -->
    <div class="grid-container">
      <div class="board-grid" id="grid"></div>
    </div>

    <!-- Dynamic Word Targets -->
    <div class="word-chips-box" id="word-chips"></div>

    <!-- Action Buttons -->
    <div class="bottom-controls">
      <button class="action-btn" id="hint-btn">💡 Hint (<span id="hint-count">3</span>)</button>
      <button class="action-btn" id="restart-btn">↺ Restart</button>
    </div>

    <!-- Victory Level Clear Screen -->
    <div class="modal-overlay" id="victory-modal">
      <div class="win-title">LEVEL CLEARED!</div>
      <div class="win-sub" id="win-summary">Great job finding all words!</div>
      <button class="next-lvl-btn" id="next-level-btn">PLAY NEXT LEVEL ➔</button>
    </div>
  </div>

  <script>
    // Game Levels Configuration (Progressive Difficulty)
    const GAME_LEVELS = [
      {
        level: 1,
        gridSize: 6,
        words: ["CAT", "DOG", "SUN", "MOON"],
        directions: ["H", "V"] // Easy: Horizontal and Vertical only
      },
      {
        level: 2,
        gridSize: 7,
        words: ["STAR", "FISH", "TREE", "BIRD", "PARK"],
        directions: ["H", "V", "D"] // Medium: Added Diagonal
      },
      {
        level: 3,
        gridSize: 8,
        words: ["PLANET", "ROCKET", "COMET", "SPACE", "ORBIT", "MARS"],
        directions: ["H", "V", "D"] // Forward directions only
      },
      {
        level: 4,
        gridSize: 9,
        words: ["PYTHON", "CODING", "SCRIPT", "DESIGN", "SYSTEM", "SERVER", "DATA"],
        directions: ["H", "V", "D"]
      },
      {
        level: 5,
        gridSize: 10,
        words: ["GALAXY", "UNIVERSE", "STATION", "GRAVITY", "ASTRONAUT", "TELESCOPE", "SHUTTLE"],
        directions: ["H", "V", "D"]
      }
    ];

    let currentLvlIndex = 0;
    let score = 0;
    let hintsRemaining = 3;
    let foundWords = new Set();
    let wordLocations = {}; // Stores letter locations for accurate hints
    let boardGridData = [];

    let isDragging = false;
    let selectedCells = [];

    // DOM Elements
    const gridEl = document.getElementById("grid");
    const wordChipsEl = document.getElementById("word-chips");
    const levelNumEl = document.getElementById("level-num");
    const scoreNumEl = document.getElementById("score-num");
    const foundNumEl = document.getElementById("found-num");
    const hintCountEl = document.getElementById("hint-count");
    const victoryModal = document.getElementById("victory-modal");
    const winSummaryEl = document.getElementById("win-summary");

    // Initialize Level
    function startLevel(levelIndex) {
      currentLvlIndex = levelIndex;
      const levelConfig = GAME_LEVELS[levelIndex];
      foundWords.clear();
      wordLocations = {};
      selectedCells = [];
      isDragging = false;
      victoryModal.classList.remove("active");

      levelNumEl.textContent = levelConfig.level;
      updateHeaderStats();

      // Generate Board Matrix with Placed Words
      generateBoard(levelConfig);

      // Render Word Target Badges
      wordChipsEl.innerHTML = "";
      levelConfig.words.forEach(word => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        chip.textContent = word;
        chip.id = `chip-${word}`;
        wordChipsEl.appendChild(chip);
      });

      // Render Grid GUI
      gridEl.innerHTML = "";
      gridEl.style.gridTemplateColumns = `repeat(${levelConfig.gridSize}, 1fr)`;

      for (let r = 0; r < levelConfig.gridSize; r++) {
        for (let c = 0; c < levelConfig.gridSize; c++) {
          const cell = document.createElement("div");
          cell.className = "grid-cell";
          cell.textContent = boardGridData[r][c];
          cell.dataset.row = r;
          cell.dataset.col = c;
          gridEl.appendChild(cell);
        }
      }
    }

    // Grid Matrix Generator with Word Placement Logic
    function generateBoard(config) {
      const size = config.gridSize;
      boardGridData = Array(size).fill(null).map(() => Array(size).fill(""));

      const possibleDirections = [
        { r: 0, c: 1 },   // Horizontal Right
        { r: 1, c: 0 },   // Vertical Down
      ];

      if (config.directions.includes("D")) {
        possibleDirections.push({ r: 1, c: 1 });  // Diagonal Down Right
        possibleDirections.push({ r: 1, c: -1 }); // Diagonal Down Left
      }

      config.words.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 150) {
          attempts++;
          const dir = possibleDirections[Math.floor(Math.random() * possibleDirections.length)];
          const startR = Math.floor(Math.random() * size);
          const startC = Math.floor(Math.random() * size);

          // Check if word fits inside board boundary
          const endR = startR + dir.r * (word.length - 1);
          const endC = startC + dir.c * (word.length - 1);

          if (endR >= 0 && endR < size && endC >= 0 && endC < size) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              const currR = startR + dir.r * i;
              const currC = startC + dir.c * i;
              const existingChar = boardGridData[currR][currC];
              if (existingChar !== "" && existingChar !== word[i]) {
                canPlace = false;
                break;
              }
            }

            if (canPlace) {
              const locations = [];
              for (let i = 0; i < word.length; i++) {
                const currR = startR + dir.r * i;
                const currC = startC + dir.c * i;
                boardGridData[currR][currC] = word[i];
                locations.push({ row: currR, col: currC });
              }
              wordLocations[word] = locations;
              placed = true;
            }
          }
        }
      });

      // Fill remaining empty cells with random uppercase letters
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (boardGridData[r][c] === "") {
            boardGridData[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
          }
        }
      }
    }

    function updateHeaderStats() {
      const currentConfig = GAME_LEVELS[currentLvlIndex];
      scoreNumEl.textContent = score;
      foundNumEl.textContent = `${foundWords.size}/${currentConfig.words.length}`;
      hintCountEl.textContent = hintsRemaining;
    }

    // Interactive Drag Selection Logic
    function getCellElementFromPoint(x, y) {
      const target = document.elementFromPoint(x, y);
      if (target && target.classList.contains("grid-cell")) {
        return target;
      }
      return null;
    }

    function handleSelectionStart(cell) {
      isDragging = true;
      selectedCells = [cell];
      cell.classList.add("selected");
    }

    function handleSelectionMove(cell) {
      if (!isDragging || !cell) return;
      const firstCell = selectedCells[0];
      const startR = parseInt(firstCell.dataset.row);
      const startC = parseInt(firstCell.dataset.col);
      const currR = parseInt(cell.dataset.row);
      const currC = parseInt(cell.dataset.col);

      const dRow = currR - startR;
      const dCol = currC - startC;

      // Lock drag to straight lines or perfect diagonals
      if (dRow === 0 || dCol === 0 || Math.abs(dRow) === Math.abs(dCol)) {
        const stepR = dRow === 0 ? 0 : dRow / Math.abs(dRow);
        const stepC = dCol === 0 ? 0 : dCol / Math.abs(dCol);

        document.querySelectorAll(".grid-cell.selected").forEach(c => c.classList.remove("selected"));
        selectedCells = [];

        let r = startR;
        let c = startC;

        while (true) {
          const targetCell = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
          if (targetCell) {
            selectedCells.push(targetCell);
            targetCell.classList.add("selected");
          }
          if (r === currR && c === currC) break;
          r += stepR;
          c += stepC;
        }
      }
    }

    function handleSelectionEnd() {
      if (!isDragging) return;
      isDragging = false;

      const selectedWord = selectedCells.map(c => c.textContent).join("");
      const currentConfig = GAME_LEVELS[currentLvlIndex];

      let matchedWord = null;
      if (currentConfig.words.includes(selectedWord) && !foundWords.has(selectedWord)) {
        matchedWord = selectedWord;
      }

      if (matchedWord) {
        foundWords.add(matchedWord);
        score += matchedWord.length * 50;

        selectedCells.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });

        const chip = document.getElementById(`chip-${matchedWord}`);
        if (chip) chip.classList.add("found");

        updateHeaderStats();

        // Check level completion
        if (foundWords.size === currentConfig.words.length) {
          setTimeout(showLevelClearModal, 500);
        }
      } else {
        selectedCells.forEach(c => c.classList.remove("selected"));
      }
      selectedCells = [];
    }
