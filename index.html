<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WORDHUNT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #120324 0%, #1e0b36 50%, #0a0214 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Title Styling */
    h1.logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff 0%, #38bdf8 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    /* Top Stats Bar */
    .stats-bar {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
    }

    .sub-instruction {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Board Grid */
    .board-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 20px;
      touch-action: none;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      width: 100%;
      aspect-ratio: 1;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .cell.selected {
      background: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 12px #00d2ff, 0 0 20px #00d2ff;
      transform: scale(1.05);
      z-index: 2;
    }

    .cell.found {
      background: rgba(72, 187, 120, 0.35);
      border: 1px solid #48bb78;
      color: #ffffff;
    }

    /* Word Badges Container */
    .words-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 5px;
      width: 100%;
    }

    .word-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      transition: all 0.3s ease;
    }

    .word-badge.found {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
      text-decoration: line-through;
      opacity: 0.6;
    }

    /* Control Buttons */
    .controls {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-top: 5px;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="logo">WORDHUNT</h1>

    <!-- Header Score Dashboard -->
    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="level-display">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score-display">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Found</div>
        <div class="stat-value" id="found-display">0/7</div>
      </div>
    </div>

    <div class="sub-instruction">Slide on the letters</div>

    <!-- Letter Matrix Board -->
    <div class="board-wrapper">
      <div class="grid" id="grid"></div>
    </div>

    <!-- Target Word Badges -->
    <div class="words-container" id="words-list"></div>

    <!-- Bottom Controls -->
    <div class="controls">
      <button class="btn" id="hint-btn">💡 Hint (<span id="hint-count">3</span>)</button>
      <button class="btn" id="next-btn">Next Level ➔</button>
      <button class="btn" id="restart-btn">↺ Restart</button>
    </div>
  </div>

  <script>
    // Levels dataset with specific targets and letters
    const LEVELS = [
      {
        level: 1,
        gridSize: 9,
        targetWords: ["SERVER", "SPEED", "WIND", "DATA", "SCREEN", "LAPTOP", "SYSTEM"],
        grid: [
          ['S','Y','S','T','E','M','V','D','T'],
          ['E','E','L','A','P','T','O','P','Y'],
          ['R','S','D','S','S','P','E','E','D'],
          ['V','Y','A','C','E','R','T','E','N'],
          ['E','M','T','S','D','E','E','E','N'],
          ['R','S','A','N','V','P','E','A','M'],
          ['I','M','I','R','S','R','T','A','E'],
          ['T','W','E','E','C','D','A','T','A'],
          ['D','S','T','S','S','W','I','N','B']
        ]
      },
      {
        level: 2,
        gridSize: 9,
        targetWords: ["SPAWN", "BASS", "VENUS", "EARTH", "CAKE", "PLANET", "MATH"],
        grid: [
          ['S','T','A','M','A','T','H','T','V'],
          ['P','A','A','E','S','P','A','W','N'],
          ['A','C','E','A','U','A','G','S','A'],
          ['W','A','B','R','A','U','A','A','E'],
          ['G','K','S','T','N','B','H','E','A'],
          ['P','E','R','E','B','A','S','E','R'],
          ['H','V','V','B','T','S','S','A','T'],
          ['V','E','N','U','S','S','A','S','H'],
          ['B','E','P','P','L','A','N','E','T']
        ]
      }
    ];

    let currentLevelIdx = 0;
    let score = 0;
    let hintsLeft = 3;
    let foundWords = new Set();
    let isSelecting = false;
    let selectedCells = [];
    let selectionDirection = null; // Stores slope/direction once confirmed

    const gridEl = document.getElementById("grid");
    const wordsListEl = document.getElementById("words-list");
    const levelDisplay = document.getElementById("level-display");
    const scoreDisplay = document.getElementById("score-display");
    const foundDisplay = document.getElementById("found-display");
    const hintCountEl = document.getElementById("hint-count");

    // Initialize Game Board
    function loadLevel(levelIndex) {
      const levelData = LEVELS[levelIndex];
      currentLevelIdx = levelIndex;
      foundWords.clear();
      selectedCells = [];
      selectionDirection = null;

      levelDisplay.textContent = levelData.level;
      updateHeader();

      // Render Target Words Badges
      wordsListEl.innerHTML = "";
      levelData.targetWords.forEach(word => {
        const badge = document.createElement("div");
        badge.className = "word-badge";
        badge.textContent = word;
        badge.id = `badge-${word}`;
        wordsListEl.appendChild(badge);
      });

      // Render Grid Cells
      gridEl.innerHTML = "";
      gridEl.style.gridTemplateColumns = `repeat(${levelData.gridSize}, 1fr)`;

      for (let r = 0; r < levelData.gridSize; r++) {
        for (let c = 0; c < levelData.gridSize; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = levelData.grid[r][c];
          cell.dataset.row = r;
          cell.dataset.col = c;
          gridEl.appendChild(cell);
        }
      }
    }

    function updateHeader() {
      const currentLevelData = LEVELS[currentLevelIdx];
      scoreDisplay.textContent = score;
      foundDisplay.textContent = `${foundWords.size}/${currentLevelData.targetWords.length}`;
      hintCountEl.textContent = hintsLeft;
    }

    // Input Handling for Drag/Slide Selection
    function getCellFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      if (el && el.classList.contains("cell")) {
        return el;
      }
      return null;
    }

    function startSelection(cell) {
      isSelecting = true;
      selectedCells = [cell];
      selectionDirection = null;
      cell.classList.add("selected");
    }

    function moveSelection(cell) {
      if (!isSelecting || !cell) return;
      const startCell = selectedCells[0];
      const startRow = parseInt(startCell.dataset.row);
      const startCol = parseInt(startCell.dataset.col);
      const currRow = parseInt(cell.dataset.row);
      const currCol = parseInt(cell.dataset.col);

      const dRow = currRow - startRow;
      const dCol = currCol - startCol;

      // Lock direction to Straight or Diagonal lines
      if (dRow === 0 || dCol === 0 || Math.abs(dRow) === Math.abs(dCol)) {
        const stepRow = dRow === 0 ? 0 : dRow / Math.abs(dRow);
        const stepCol = dCol === 0 ? 0 : dCol / Math.abs(dCol);

        // Clear previous selections
        document.querySelectorAll(".cell.selected").forEach(c => c.classList.remove("selected"));
        selectedCells = [];

        let r = startRow;
        let c = startCol;

        while (true) {
          const targetCell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
          if (targetCell) {
            selectedCells.push(targetCell);
            targetCell.classList.add("selected");
          }
          if (r === currRow && c === currCol) break;
          r += stepRow;
          c += stepCol;
        }
      }
    }

    function endSelection() {
      if (!isSelecting) return;
      isSelecting = false;

      const selectedWord = selectedCells.map(c => c.textContent).join("");
      const reversedWord = selectedWord.split("").reverse().join("");
      const currentLevelData = LEVELS[currentLevelIdx];

      let matchedWord = null;
      if (currentLevelData.targetWords.includes(selectedWord) && !foundWords.has(selectedWord)) {
        matchedWord = selectedWord;
      } else if (currentLevelData.targetWords.includes(reversedWord) && !foundWords.has(reversedWord)) {
        matchedWord = reversedWord;
      }

      if (matchedWord) {
        foundWords.add(matchedWord);
        score += matchedWord.length * 50;

        selectedCells.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });

        const badge = document.getElementById(`badge-${matchedWord}`);
        if (badge) badge.classList.add("found");

        updateHeader();
      } else {
        selectedCells.forEach(c => c.classList.remove("selected"));
      }
      selectedCells = [];
    }

    // Event Listeners for Touch and Mouse Dragging
    gridEl.addEventListener("mousedown", (e) => {
      if (e.target.classList.contains("cell")) startSelection(e.target);
    });

    gridEl.addEventListener("mousemove", (e) => {
      moveSelection(getCellFromPoint(e.clientX, e.clientY));
    });

    window.addEventListener("mouseup", endSelection);

    gridEl.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      const cell = getCellFromPoint(touch.clientX, touch.clientY);
      if (cell) startSelection(cell);
    });

    gridEl.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      moveSelection(getCellFromPoint(touch.clientX, touch.clientY));
    });

    window.addEventListener("touchend", endSelection);

    // Controls Action Listeners
    document.getElementById("restart-btn").addEventListener("click", () => {
      loadLevel(currentLevelIdx);
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      const nextIdx = (currentLevelIdx + 1) % LEVELS.length;
      loadLevel(nextIdx);
    });

    document.getElementById("hint-btn").addEventListener("click", () => {
      if (hintsLeft <= 0) return;
      const currentLevelData = LEVELS[currentLevelIdx];
      const remainingWords = currentLevelData.targetWords.filter(w => !foundWords.has(w));
      
      if (remainingWords.length > 0) {
        hintsLeft--;
        const wordToHint = remainingWords[0];
        const badge = document.getElementById(`badge-${wordToHint}`);
        if (badge) {
          badge.style.border = "2px solid #00d2ff";
          setTimeout(() => badge.style.border = "", 2000);
        }
        updateHeader();
      }
    });

    // Initial Launch
    loadLevel(0);
  </script>
</body>
</html>
