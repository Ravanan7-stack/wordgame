<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Word Hunt</title>
<style>
:root{--bg:#06050f;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--text:#f6f4ff;--muted:#a9a5c4;--p:#a044ff;--b:#4d7cff;--c:#22e4ff;--r:#ff4d7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);z-index:-1;animation:float 14s ease-in-out infinite alternate}
body::before{background:var(--blob1,#7b2cff);transition:background 1s;opacity:.5;top:-25vmax;left:-20vmax}
body::after{background:var(--blob2,#ff3d8b);transition:background 1s;opacity:.3;bottom:-30vmax;right:-25vmax;animation-delay:-7s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1{font-size:2rem;font-weight:900;letter-spacing:.12em;margin:6px 0 14px;text-shadow:0 0 24px #a044ff}
h1 span{background:linear-gradient(90deg,var(--c),var(--p),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(94vw,480px);margin-bottom:12px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;backdrop-filter:blur(10px)}
.stat small{display:block;font-size:.62rem;letter-spacing:.15em;color:var(--muted)}
.stat b{font-size:1.15rem}
.tbar{width:min(94vw,480px);height:8px;border-radius:8px;background:var(--glass);margin:12px 0 8px;overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c),var(--p));border-radius:8px;transition:width .3s linear,background .3s}
.tbar.low i{background:linear-gradient(90deg,var(--r),#ff9a4d)}
.hint{color:var(--muted);font-size:.8rem;margin-bottom:10px;text-align:center;max-width:94vw}
#grid{--n:9;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(94vw,480px);padding:9px;background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:0 0 50px #7c4dff44,inset 0 0 30px #ffffff08;backdrop-filter:blur(12px);user-select:none;-webkit-user-select:none;touch-action:none}
#grid.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.c{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-weight:800;font-size:calc(min(94vw,480px)/var(--n)*.44);background:rgba(255,255,255,.06);transition:background .12s,transform .12s,box-shadow .12s}
.c.sel{background:linear-gradient(135deg,var(--c),var(--b));transform:scale(1.12);box-shadow:0 0 14px var(--c);color:#04030c;z-index:1}
.c.hintc{animation:pulse .5s ease-in-out 4;box-shadow:0 0 16px #ffd84d}
@keyframes pulse{50%{transform:scale(1.25);background:#ffd84d;color:#000}}
#words{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px;width:min(94vw,480px)}
.w{padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:var(--glass);font-size:.8rem;font-weight:600;letter-spacing:.1em;transition:.25s}
.w.done{text-decoration:line-through;opacity:.75}
.tools{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;justify-content:center}
button,select{font:inherit;font-weight:700;color:#fff;border:1px solid var(--line);border-radius:30px;padding:10px 20px;background:var(--glass);backdrop-filter:blur(10px);cursor:pointer}
select{background:#14122c}
button.main{border:0;background:linear-gradient(90deg,var(--p),var(--b));box-shadow:0 6px 24px #7c4dff66}
button.ghost{background:transparent}
button:disabled{opacity:.35}
#ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,4,15,.72);backdrop-filter:blur(8px);z-index:50;padding:20px}
#ov.show{display:grid}
.card{background:linear-gradient(160deg,#1c1840,#0c0a1e);border:1px solid var(--p);border-radius:28px;padding:28px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 60px #a044ff66;animation:pop .35s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{font-size:1.7rem;margin-bottom:8px}
.card p{color:var(--muted);margin-bottom:20px;line-height:1.6;white-space:pre-line}
.card button{display:block;width:100%;margin-top:10px}
.cf{position:fixed;top:-20px;font-size:1.4rem;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<h1>WORD<span>HUNT</span></h1>
<div class="hud">
  <div class="stat"><small>LEVEL</small><b id="lv">1</b></div>
  <div class="stat"><small>SCORE</small><b id="score">0</b></div>
  <div class="stat"><small>FOUND</small><b id="found">0/0</b></div>
</div>
<p class="hint" id="hint"></p>
<div id="grid"></div>
<div id="words"></div>
<div class="tools">
  <button id="hintBtn">💡 Hint</button>
  <button id="again">↻ Restart</button>
</div>
<div id="ov"><div class="card"><h2 id="ovt"></h2><p id="ovp"></p><button class="main" id="ovb"></button><button class="ghost" id="ovb2"></button></div></div>

<script>
const MAX=300;
const HUES=[350,15,40,58,100,140,168,190,212,240,268,292,318,5];
const POOL=("CAT DOG SUN MOON STAR FIRE ICE WIND RAIN SNOW TREE LEAF ROCK SAND WAVE SEA LAKE RIVER HILL "+
"CODE GAME PLAY WIN LOSE LOOT BOSS NOOB CLAN RANK SKIN BUFF NERF LAG PING FPS CHAT TEAM SQUAD QUEST LEVEL "+
"STEAM DISCORD GAMER PIXEL RESPAWN ARENA GUILD SPAWN CHEAT STREAM SERVER MATCH SCORE COMBO POWER SHIELD "+
"MOUSE KEYS SCREEN LAPTOP PHONE TABLET CAMERA ROUTER CHIP RAM DISK CABLE WIFI CLOUD ROBOT DRONE MEMORY "+
"CONSOLE JOYSTICK KEYBOARD MONITOR HEADSET STORAGE SYSTEM WINDOWS LINUX PYTHON SCRIPT BROWSER WEBSITE "+
"DOMAIN HOSTING DESIGN LAYOUT BUTTON FOLDER FILE LINK PAGE LOGIN EMAIL APP BUG FIX DEBUG TOOL DATA NET "+
"CAR RACE DRIFT TURBO ENGINE GARAGE SPEED NITRO CRASH WHEEL BRAKE TYRE FUEL GEAR LAP TRACK ROAD SPORT "+
"SWORD KNIGHT WIZARD DRAGON DUNGEON ARMOR POTION TREASURE CHEST MAP GOLD GEM CROWN CASTLE HERO VILLAIN "+
"SPACE ROCKET GALAXY PLANET ORBIT LASER ALIEN COMET MARS EARTH VENUS SATURN STARS COSMOS ASTEROID "+
"MUSIC BEAT SONG BASS DRUM GUITAR PIANO VIDEO AUDIO PHOTO FILM MOVIE ANIME COMIC STORY POEM DREAM "+
"PIZZA BURGER NOODLE RICE CAKE COOKIE CANDY JUICE TEA MILK FRUIT APPLE MANGO GRAPE LEMON BREAD EGG "+
"HAPPY SMILE LAUGH FRIEND FAMILY LOVE PEACE HOPE BRAVE SMART FAST STRONG CALM KIND LUCKY CHAMP LEGEND "+
"TIGER LION EAGLE SHARK WOLF PANDA HORSE SNAKE MONKEY ZEBRA CAMEL FALCON PARROT DOLPHIN TURTLE RABBIT "+
"SCHOOL BOOK PEN PAPER MATH SCIENCE LEARN STUDY EXAM IDEA THINK CREATE BUILD DRAW WRITE READ GOAL").split(" ");
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let level=1,unlocked=1,score=0,grid,words,placed,found,size,hearts,hints,t0,limit,timer,over,mystery,lastFind=0,combo=0,pal=[];
let drag=null,tapStart=null,path=[];
try{unlocked=Math.min(MAX,parseInt(localStorage.getItem("wh_unlocked"))||1);score=parseInt(localStorage.getItem("wh_score"))||0}catch(e){}
const save=()=>{try{localStorage.setItem("wh_unlocked",unlocked);localStorage.setItem("wh_score",score)}catch(e){}};

function cfg(l){
  const n=Math.min(9+Math.floor((l-1)/6),15);
  const count=Math.min(7+Math.floor((l-1)/4),26);
  const minLen=Math.min(4+Math.floor(l/10),8);
  const dirs=[[0,1],[1,0],[1,1],[-1,1]];
  return {n,count,minLen,dirs};
}

function build(){
  const {n,count,minLen,dirs}=cfg(level);size=n;
  const pool=[...new Set(POOL)].filter(w=>w.length<=n).sort(()=>Math.random()-.5);
  pool.sort((x,y)=>(y.length>=minLen)-(x.length>=minLen));
  grid=Array.from({length:n},()=>Array(n).fill(""));
  words=[];placed={};
  const place=w=>{
    for(let t=0;t<500;t++){
      const [dr,dc]=dirs[rnd(dirs.length)];
      const r=rnd(n),c=rnd(n);
      const er=r+dr*(w.length-1),ec=c+dc*(w.length-1);
      if(er<0||er>=n||ec<0||ec>=n)continue;
      let ok=true;
      for(let i=0;i<w.length;i++){const v=grid[r+dr*i][c+dc*i];if(v&&v!==w[i]){ok=false;break}}
      if(!ok)continue;
      for(let i=0;i<w.length;i++)grid[r+dr*i][c+dc*i]=w[i];
      return {r,c};
    }
    return null;
  };
  for(const w of pool){if(words.length>=count)break;const p=place(w);if(p){words.push(w);placed[w]=p}}
  // fake words: near-misses that look real (missing or swapped last letter)
  let d=0;const goal=Math.floor(words.length*.7);
  for(const w of words){
    if(d>=goal)break;
    const f=d%2?w.slice(0,-1):w.slice(0,-1)+A[rnd(26)];
    if(f.length>=3&&f!==w&&!POOL.includes(f)&&place(f))d++;
  }
  const src=words.join("");
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!grid[r][c])grid[r][c]=src[rnd(src.length)];
}

function render(){
  const g=$("grid");g.innerHTML="";g.style.setProperty("--n",size);
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    const d=document.createElement("div");
    d.className="c";d.textContent=grid[r][c];
    g.appendChild(d);
  }
  $("words").innerHTML=words.map(w=>`<span class="w" id="w-${w}">${mystery?w[0]+" _".repeat(w.length-1):w}</span>`).join("");
}
const cell=(r,c)=>$("grid").children[r*size+c];

function hud(){
  $("lv").textContent=level;$("score").textContent=score;
  $("found").textContent=(found?found.size:0)+"/"+(words?words.length:0);
  $("hintBtn").textContent="💡 Hint ("+hints+")";$("hintBtn").disabled=hints<=0||over;
}

function cellAt(x,y){
  const el=document.elementFromPoint(x,y);
  const c=el&&el.closest&&el.closest(".c");
  if(!c)return null;
  const i=[...$("grid").children].indexOf(c);
  return [Math.floor(i/size),i%size];
}
function line(a,b){
  const dr=b[0]-a[0],dc=b[1]-a[1],ar=Math.abs(dr),ac=Math.abs(dc);
  if(!ar&&!ac)return [a];
  let sr=Math.sign(dr),sc=Math.sign(dc),len;
  if(ar>2*ac){sc=0;len=ar}else if(ac>2*ar){sr=0;len=ac}else len=Math.round((ar+ac)/2);
  const out=[];
  for(let i=0;i<=len;i++){const r=a[0]+sr*i,c=a[1]+sc*i;if(r<0||r>=size||c<0||c>=size)break;out.push([r,c])}
  return out;
}
function show(p){
  document.querySelectorAll(".c.sel").forEach(e=>e.classList.remove("sel"));
  path=p;p.forEach(([r,c])=>cell(r,c).classList.add("sel"));
}

function check(p){
  const s=p.map(([r,c])=>grid[r][c]).join("");
  const rev=[...s].reverse().join("");
  const w=words.find(x=>!found.has(x)&&(x===s||x===rev));
  if(w){
    found.add(w);
    const k=found.size-1,h=pal[k%pal.length],L=k<pal.length?58:44;
    p.forEach(([r,c])=>{const e=cell(r,c);e.classList.remove("hintc");e.style.background=`linear-gradient(135deg,hsl(${h} 90% ${L}%),hsl(${(h+30)%360} 90% ${L-8}%))`;e.style.color="#fff"});
    const chip=$("w-"+w);chip.classList.add("done");chip.textContent=w;
    chip.style.background=`hsl(${h} 80% ${L-12}% / .55)`;chip.style.borderColor=`hsl(${h} 90% 65%)`;
    const now=Date.now();combo=now-lastFind<7000?Math.min(combo+1,5):0;lastFind=now;
    score+=100+w.length*10+combo*25;hud();
    if(found.size===words.length)win();
    return;
  }
}
const g=$("grid");
g.addEventListener("pointerdown",e=>{
  if(over)return;
  const c=cellAt(e.clientX,e.clientY);if(!c)return;
  e.preventDefault();
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  drag=tapStart||c;
  show(tapStart?line(tapStart,c):[c]);
});
g.addEventListener("pointermove",e=>{
  if(!drag)return;
  const c=cellAt(e.clientX,e.clientY);if(c)show(line(drag,c));
});
g.addEventListener("pointerup",()=>{
  if(!drag)return;
  const p=path;
  if(p.length>1){check(p);tapStart=null;show([])}
  else if(tapStart){tapStart=null;show([])}
  else tapStart=p[0];
  drag=null;
});
g.addEventListener("pointercancel",()=>{drag=null;tapStart=null;show([])});

function confetti(){
  for(let i=0;i<45;i++){
    const s=document.createElement("span");s.className="cf";
    s.textContent=["✨","🎉","⭐","💜","🔥"][rnd(5)];
    s.style.left=rnd(100)+"vw";s.style.animationDuration=(1.8+Math.random()*1.8)+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),3800);
  }
}
function overlay(t,p,b1,f1,b2,f2){
  $("ovt").textContent=t;$("ovp").textContent=p;
  $("ovb").textContent=b1;$("ovb").onclick=()=>{$("ov").classList.remove("show");f1()};
  $("ovb2").textContent=b2;$("ovb2").style.display=b2?"block":"none";
  $("ovb2").onclick=()=>{$("ov").classList.remove("show");f2&&f2()};
  $("ov").classList.add("show");
}
function win(){
  over=true;
  const bonus=words.length*20;score+=bonus;
  if(level<MAX&&level+1>unlocked)unlocked=level+1;
  save();hud();confetti();
  const last=level>=MAX;
  overlay(last?"🏆 You beat all levels!":"🎉 Level "+level+" cleared!",
    "Words found: "+words.length+"\nBonus: +"+bonus+"\nScore: "+score,
    last?"Play again":"Next level ▶",()=>{if(last){level=1;unlocked=1;save()}else level++;init()});
}

function init(){
  found=new Set();drag=null;tapStart=null;path=[];over=false;combo=0;lastFind=0;
  hints=3;mystery=level%5===0;
  pal=[...HUES].sort(()=>Math.random()-.5);
  const th=(level*37)%360,rs=document.documentElement.style;
  rs.setProperty("--blob1","hsl("+th+" 90% 55%)");rs.setProperty("--blob2","hsl("+(th+70)%360+" 90% 55%)");
  build();render();hud();
  $("hint").textContent="Slide on the letters"+(mystery?" 🕵️ MYSTERY level: words are hidden!":"");
}

$("hintBtn").onclick=()=>{
  if(over||hints<=0)return;
  const w=words.filter(x=>!found.has(x));if(!w.length)return;
  const p=placed[w[rnd(w.length)]];
  hints--;hud();
  const e=cell(p.r,p.c);e.classList.add("hintc");setTimeout(()=>e.classList.remove("hintc"),2200);
};
$("again").onclick=init;
level=unlocked;
init();
</script>
</body>
</html>
